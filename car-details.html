<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLC Car Details</title>
<style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; overflow-x: hidden; background: #f4efe5; color: #2e2924; font-family: "Trebuchet MS", Arial, sans-serif; }
    nav { min-height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 7%; background: #faf7f0; border-bottom: 1px solid #cbbda6; box-shadow: 0 2px 12px rgba(47,38,28,.08); }
    .logo, h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; }
    .logo { color: #671f26; font-size: 32px; font-weight: bold; letter-spacing: 3px; }
    nav a { color: #40362d; font-weight: bold; text-decoration: none; }
    nav a:hover { color: #8b2932; }
    main { width: min(1200px, 92%); margin: 40px auto 80px; }
    .eyebrow { color: #8b2932; font-size: 13px; font-weight: bold; letter-spacing: 3px; }
    h1 { margin: 10px 0 28px; color: #2e2924; font-size: clamp(35px, 5vw, 56px); }
    .carousel { position: relative; overflow: hidden; border: 1px solid #cbbda6; background: #201d1a; box-shadow: 0 16px 38px rgba(70,55,38,.18); }
    .carousel-track { display: flex; transition: transform .55s ease; }
    .slide { min-width: 100%; height: min(58vw, 580px); position: relative; }
    .slide img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .slide-label { position: absolute; left: 22px; bottom: 20px; padding: 9px 14px; background: rgba(32,29,26,.78); color: #fff; font-size: 14px; }
    .slider-button { position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border: 1px solid #cbbda6; border-radius: 50%; background: rgba(250,247,240,.94); color: #671f26; font-size: 34px; cursor: pointer; line-height: 40px; transition: .2s; }
    .slider-button:hover { color: #fff; background: #671f26; }
    .previous { left: 22px; }
    .next { right: 22px; }
    .dots { position: absolute; bottom: 20px; right: 22px; display: flex; gap: 8px; }
    .dot { width: 10px; height: 10px; padding: 0; border: 1px solid #fff; border-radius: 50%; background: transparent; cursor: pointer; }
    .dot.active { background: #fff; }
    .details-layout { display: grid; grid-template-columns: 1.45fr .85fr; gap: 26px; margin-top: 28px; }
    .panel { background: #faf7f0; border: 1px solid #cbbda6; padding: 30px; box-shadow: 0 8px 20px rgba(70,55,38,.08); }
    .panel h2 { margin: 0 0 14px; color: #671f26; font-size: 30px; }
    .description { color: #62564b; font-size: 17px; line-height: 1.75; }
    .spec-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; margin: 24px 0; border: 1px solid #d9ccb8; background: #d9ccb8; }
    .spec { min-height: 82px; padding: 16px; background: #fffdf8; }
    .spec small { display: block; color: #8b2932; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
    .spec strong { display: block; margin-top: 7px; color: #40362d; font-size: 16px; }
    .feature-list { display: grid; gap: 12px; padding: 0; margin: 18px 0 0; list-style: none; }
    .feature-list li { color: #51453a; }
    .feature-list li::before { content: "✦"; margin-right: 10px; color: #8b2932; }
    .price { color: #671f26; font-family: Georgia, "Times New Roman", serif; font-size: 35px; font-weight: bold; }
    .contact-button { width: 100%; margin-top: 22px; padding: 15px 18px; border: 1px solid #671f26; border-radius: 2px; background: #671f26; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: .2s; }
    .contact-button:hover { background: #3f151a; transform: translateY(-2px); }
    .related { margin-top: 54px; }
    .related-title { margin-bottom: 8px; color: #2e2924; font-size: 35px; }
    .related-subtitle { margin: 0 0 24px; color: #62564b; }
    .related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .related-card { overflow: hidden; border: 1px solid #cbbda6; background: #faf7f0; cursor: pointer; box-shadow: 0 8px 20px rgba(70,55,38,.08); transition: .25s; }
    .related-card:hover, .related-card:focus-visible { outline: none; transform: translateY(-5px); box-shadow: 0 14px 24px rgba(70,55,38,.16); }
    .related-card img { width: 100%; height: 180px; display: block; object-fit: cover; }
    .related-card-content { padding: 17px; }
    .related-card h3 { margin: 0 0 8px; color: #671f26; font-size: 22px; }
    .related-card p { margin: 0; color: #62564b; font-size: 14px; }
    @media (max-width: 768px) {
        nav { min-height: 68px; padding: 13px 5%; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 27px; }
        main { width: min(100% - 28px, 680px); margin: 28px auto 55px; }
        .slide { height: 62vw; min-height: 280px; }
        .slider-button { width: 44px; height: 44px; font-size: 30px; }
        .previous { left: 12px; }
        .next { right: 12px; }
        .dots { right: 14px; bottom: 14px; }
        .slide-label { left: 14px; bottom: 14px; }
        .details-layout { grid-template-columns: 1fr; gap: 18px; }
        .panel { padding: 22px; }
        .related-grid { grid-template-columns: 1fr; }
        .related-card { display: grid; grid-template-columns: 130px 1fr; }
        .related-card img { height: 100%; min-height: 120px; }
    }
    @media (max-width: 420px) {
        .spec-grid { grid-template-columns: 1fr; }
        .slide { min-height: 240px; }
        .panel h2 { font-size: 26px; }
        .related-card { grid-template-columns: 110px 1fr; }
    }
</style>
</head>
<body>
<nav>
    <div class="logo">BLC</div>
    <a href="index.html#cars">← Back to All Cars</a>
</nav>

<main>
    <div class="eyebrow" id="carBrand">BLC COLLECTION</div>
    <h1 id="carName">Car Details</h1>

    <section class="carousel" id="carousel" aria-label="Car photo gallery">
        <div class="carousel-track" id="carouselTrack"></div>
        <button class="slider-button previous" id="previousButton" type="button" aria-label="Previous photo">‹</button>
        <button class="slider-button next" id="nextButton" type="button" aria-label="Next photo">›</button>
        <div class="dots" id="dots" aria-label="Choose photo"></div>
    </section>

    <section class="details-layout">
        <article class="panel">
            <h2>About This Car</h2>
            <p class="description" id="description"></p>
            <div class="spec-grid" id="specGrid"></div>
            <h2>Key Features</h2>
            <ul class="feature-list" id="features"></ul>
        </article>
        <aside class="panel">
            <div class="eyebrow">BLC OFFER PRICE</div>
            <p class="price" id="price"></p>
            <p class="description">Request a personalised quote, finance plan, or a private viewing from the BLC team.</p>
            <button class="contact-button" id="contactButton" type="button">Contact / More Info</button>
        </aside>
    </section>

    <section class="related">
        <h2 class="related-title">You May Also Like</h2>
        <p class="related-subtitle">Explore more carefully selected cars from the BLC collection.</p>
        <div class="related-grid" id="relatedGrid"></div>
    </section>
</main>

<script src="cars.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const selectedId = Number(params.get("id")) || 1;
    const car = cars.find((item) => item.id === selectedId) || cars[0];
    let activeSlide = 0;
    let autoSlide;

    const carName = document.getElementById("carName");
    const carBrand = document.getElementById("carBrand");
    const track = document.getElementById("carouselTrack");
    const dots = document.getElementById("dots");

    carName.textContent = car.name;
    carBrand.textContent = car.brand.toUpperCase() + " • BLC COLLECTION";
    document.title = car.name + " | BLC Cars";
    document.getElementById("description").textContent = car.description;
    document.getElementById("price").textContent = car.price;

    const specs = [
        ["BRAND", car.brand], ["HORSEPOWER", car.horsepower], ["TOP SPEED", car.topSpeed],
        ["ENGINE", car.engine], ["MILEAGE", car.mileage], ["PRICE", car.price]
    ];
    document.getElementById("specGrid").innerHTML = specs.map(([label, value]) =>
        '<div class="spec"><small>' + label + '</small><strong>' + value + '</strong></div>'
    ).join("");
    document.getElementById("features").innerHTML = car.features.map((feature) => "<li>" + feature + "</li>").join("");

    track.innerHTML = car.photos.map((photo, index) =>
        '<div class="slide"><img src="' + photo + '" alt="' + car.name + ' photo ' + (index + 1) + '"><span class="slide-label">' + car.name + " · Photo " + (index + 1) + "</span></div>"
    ).join("");
    dots.innerHTML = car.photos.map((_, index) =>
        '<button class="dot" type="button" aria-label="Show photo ' + (index + 1) + '"></button>'
    ).join("");

    function showSlide(index) {
        activeSlide = (index + car.photos.length) % car.photos.length;
        track.style.transform = "translateX(-" + (activeSlide * 100) + "%)";
        document.querySelectorAll(".dot").forEach((dot, dotIndex) => dot.classList.toggle("active", dotIndex === activeSlide));
    }
    function restartAutoSlide() {
        clearInterval(autoSlide);
        autoSlide = setInterval(() => showSlide(activeSlide + 1), 4500);
    }
    document.getElementById("previousButton").addEventListener("click", () => { showSlide(activeSlide - 1); restartAutoSlide(); });
    document.getElementById("nextButton").addEventListener("click", () => { showSlide(activeSlide + 1); restartAutoSlide(); });
    document.querySelectorAll(".dot").forEach((dot, index) => dot.addEventListener("click", () => { showSlide(index); restartAutoSlide(); }));

    let touchStartX = 0;
    const carousel = document.getElementById("carousel");
    carousel.addEventListener("touchstart", (event) => { touchStartX = event.changedTouches[0].screenX; }, { passive: true });
    carousel.addEventListener("touchend", (event) => {
        const difference = event.changedTouches[0].screenX - touchStartX;
        if (Math.abs(difference) > 45) showSlide(activeSlide + (difference < 0 ? 1 : -1));
        restartAutoSlide();
    }, { passive: true });
    carousel.addEventListener("mouseenter", () => clearInterval(autoSlide));
    carousel.addEventListener("mouseleave", restartAutoSlide);
    document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") { showSlide(activeSlide - 1); restartAutoSlide(); }
        if (event.key === "ArrowRight") { showSlide(activeSlide + 1); restartAutoSlide(); }
    });
    showSlide(0);
    restartAutoSlide();

    const relatedCars = cars.filter((item) => item.id !== car.id).slice(0, 3);
    document.getElementById("relatedGrid").innerHTML = relatedCars.map((item) =>
        '<article class="related-card" tabindex="0" role="link" aria-label="View details for ' + item.name + '" data-id="' + item.id + '">' +
        '<img src="' + item.image + '" alt="' + item.name + '"><div class="related-card-content"><h3>' + item.name + '</h3><p>' + item.horsepower + " · " + item.price + "</p></div></article>"
    ).join("");
    document.querySelectorAll(".related-card").forEach((card) => {
        const openRelatedCar = () => { window.location.href = "car-details.html?id=" + card.dataset.id; };
        card.addEventListener("click", openRelatedCar);
        card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openRelatedCar(); }
        });
    });
    document.getElementById("contactButton").addEventListener("click", () => {
        const message = "Hello BLC, I would like more information about the " + car.name + ".";
        window.open("https://wa.me/918262090231?text=" + encodeURIComponent(message), "_blank");
    });
</script>
</body>
</html>
